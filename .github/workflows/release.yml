# Tokenless release: npm OIDC Trusted Publishing + provenance.
#
# MANUAL-ONLY for now: this runs ONLY when you click "Run workflow" (workflow_dispatch). Releases are
# cut by hand via `pnpm release` (which does the local `npm publish`). The automatic `v*`-tag trigger
# is intentionally commented out below until npm Trusted Publishing is configured (see ONE-TIME SETUP)
# — otherwise every `pnpm release` tag would fire this, it would fail OIDC auth (no Trusted Publisher)
# or collide with the version the local flow already published. Re-enable the tag trigger only AFTER
# the setup below AND after deciding this workflow — not `pnpm release` — is the canonical publisher.
#
# Why this shape (supply-chain hardening):
#   - NO long-lived npm token is stored anywhere. The job mints a short-lived OIDC credential
#     (`id-token: write`) that npm verifies against a Trusted Publisher you register on the
#     package. Token theft (the npm-worm payload) has nothing to steal.
#   - `--provenance` publishes a signed attestation tying the tarball to this exact commit +
#     workflow (verifiable via `npm audit signatures`).
#   - Actions pinned to commit SHAs (tags can be re-pointed).
#
# ONE-TIME SETUP (after the FIRST manual publish creates the package):
#   npmjs.com → @sshanzel/plex → Settings → Trusted Publisher → GitHub Actions:
#     repository = sshanzel/plex,  workflow = release.yml
#   (Account 2FA "authorization and writes" still protects manual writes; CI/OIDC is exempt.)
# Fallback without Trusted Publishing: add repo secret NPM_TOKEN (granular, this-package-only,
# short expiry) and uncomment the NODE_AUTH_TOKEN env on the publish step.
name: release

on:
  # Re-enable this once npm Trusted Publishing is set up (ONE-TIME SETUP above) to auto-publish on a
  # release tag. Left off so `pnpm release`'s tag push does NOT trigger a (failing) auto-publish.
  # push:
  #   tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for OIDC Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # single source of truth w/ ci.yml — Node 24+ (Kùzu native SIGSEGVs on Node 20 Linux; the `pnpm test` gate below opens Kùzu)
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Pinned (not @latest): this runs in the privileged publish job (id-token: write), so the one
      # tool that isn't SHA-pinned shouldn't float. npm >= 11.5.1 is the floor for OIDC Trusted
      # Publishing + provenance; bump this deliberately, don't track latest.
      - run: npm install -g npm@11.5.1 # provenance + trusted-publishing support
      - run: pnpm install --frozen-lockfile
      - run: pnpm test # gate: don't ship a failing build
      - run: npm publish --provenance --access public # prepack builds dist/; OIDC auth, no token
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}  # only if NOT using Trusted Publishing

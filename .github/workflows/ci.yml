# Quality + supply-chain gate — the green-for-consistency check.
#
# Runs on every push to main and every PR targeting main. It mirrors the local "all green" set:
# typecheck → unit + quality-floor evals (vitest) → integration scenarios (tsx, one Kùzu open per
# process, ADR-17) → build → the node-runtime E2Es that drive the BUILT CLI (brain / worktree-seed /
# co-change / deletion). No secrets: every test runs offline with the `fake` embedder / injected
# fetch+llm, so forks and Dependabot PRs pass without access to any key.
#
# Third-party Actions are pinned to a commit SHA (a tag like `@v6` can be silently re-pointed —
# an Action is itself a supply-chain dependency). The trailing comment is the human-readable tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same branch/PR cancels an in-flight run — saves minutes, and only the latest
# commit's status matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege; this job only reads the repo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # single source of truth (Node 24+ — Kùzu native is unstable on Node 20 Linux)
          cache: pnpm

      # The integration + E2E suites build throwaway git repos and commit into them; a runner has
      # no global git identity, so set one (and a modern default branch) or `git commit` fails.
      - name: Configure git identity for throwaway-repo tests
        run: |
          git config --global user.email "ci@plex.local"
          git config --global user.name "Plex CI"
          git config --global init.defaultBranch main

      - run: pnpm install --frozen-lockfile # exact, hash-verified deps — no drift (builds kuzu/esbuild via onlyBuiltDependencies)
      - run: pnpm audit --audit-level=high # supply-chain gate: fail on known high/critical advisories
      - run: pnpm typecheck # tsc, whole workspace (paths-mapped)
      - run: pnpm test # vitest units + quality-floor evals, then the tsx integration scenarios
      - run: pnpm build # produces dist/plex.js + dist/plex-mcp.js (verifies the bundle + feeds the E2Es)

      # Node-runtime E2Es: exercise the SHIPPED build under plain node (stable past the tsx Kùzu
      # open-limit, ADR-17). `pnpm build` above already produced dist/, so call the scripts directly.
      - run: node scripts/brain-check.mjs # auto-index + rounds + changed-without-feedback
      - run: node scripts/worktree-seed-check.mjs # ADR-32 worktree graph seeding, no SIGSEGV
      - run: node scripts/sweep-check.mjs # ADR-43 maintenance worker: refresh main + sidecars + idempotent
      - run: node scripts/cochange-check.mjs # incremental + cross-window co-change accumulation
      - run: node scripts/deleted-radius-check.mjs # deletion blast radius
      - run: node scripts/py-check.mjs # ADR-52 Python: wasm-from-bundle index + blast + review findings

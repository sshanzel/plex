# Quality + supply-chain gate.
#
# DORMANT BY DESIGN: the only trigger is manual `workflow_dispatch`, so committing/pushing this
# file does NOT start running CI on every push. It appears in the Actions tab; run it on demand.
# To turn it into real CI later, uncomment the `push:` / `pull_request:` triggers below.
#
# Third-party Actions are pinned to a commit SHA (a tag like `@v6` can be silently re-pointed —
# an Action is itself a supply-chain dependency). The trailing comment is the human-readable tag.
name: ci

on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read # least privilege; this job only reads the repo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile # exact, hash-verified deps — no drift from the lockfile
      - run: pnpm audit --audit-level=high # fail on known high/critical advisories
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
